[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "B", "D", "S"]
ignore = ["D203", "D213", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S"]

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hal-9000-contradiction-lab"
version = "1.0.0"
description = "Blinded, resumable, cumulative test of how models handle HAL 9000's conflicting directives"
license = "Apache-2.0"
requires-python = ">=3.14"
dependencies = ["Flask~=3.1.0", "google-cloud-storage~=3.4.0", "gunicorn~=23.0.0", "httpx~=0.28.0"]

[tool.setuptools.packages.find]
include = ["hal*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
hal = ["*.json", "fixtures/*.json"]
